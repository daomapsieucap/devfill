<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DevFill</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="popup">
  <div class="df-card">
    <header class="df-header">
      <div class="df-brand">
        <img class="df-brand-icon" src="icons/icon48.png" width="24" height="24" alt="DevFill logo" />
        <div class="df-brand-text">
          <span class="df-brand-name">devfill</span>
          <span id="df-version" class="df-brand-version"></span>
        </div>
      </div>
      <div class="df-header-actions">
        <a href="https://github.com/daomapsieucap/devfill" target="_blank" rel="noopener noreferrer" class="df-github-link" title="View on GitHub">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
          </svg>
        </a>
        <button id="sync-status-group" type="button" class="df-status-group" title="Sync: not configured">
          <span id="sync-status-dot" class="df-status-dot df-status-gray"></span>
          <span id="sync-status-label" class="df-status-label">sync off</span>
        </button>
      </div>
    </header>

    <div class="df-body">
      <p class="df-prompt">
        <b>dev@fill</b>:~$ <span class="df-accent">devfill --preset</span><span class="df-cursor"></span>
      </p>

      <div class="df-section-label">
        <span class="df-section-dot"></span>
        <span class="df-section-text"><span class="df-accent-thin">&lt;?</span>profile</span>
        <span class="df-rule"></span>
        <span id="df-preset-count" class="df-section-count">01 · 0</span>
      </div>

      <label id="preset-select-wrap" class="df-select-wrap">
        <select id="preset-select" class="df-select"></select>
        <span class="df-select-caret">▾</span>
      </label>

      <div class="df-actions">
        <button id="fill-random-btn" type="button" class="df-btn df-btn-primary">
          <span class="df-sigil">$</span>
          <span>fill --random</span>
          <span class="df-spacer"></span>
          <span class="df-key-hint">↵</span>
        </button>
        <button id="fill-preset-btn" type="button" class="df-btn df-btn-secondary">
          <span class="df-sigil">$</span>
          <span>fill --preset</span>
          <span class="df-spacer"></span>
          <span class="df-key-hint-muted">⇧P</span>
        </button>
      </div>

      <div class="df-check-row">
        <input type="checkbox" id="highlight-toggle" class="df-check-input" />
        <label for="highlight-toggle" class="df-check-label">
          <span class="df-check-box"><span class="df-check-tick">✓</span></span>
          <span class="df-check-text"><span class="df-accent">--</span>highlight-fields</span>
          <span class="df-spacer"></span>
          <span id="highlight-state" class="df-check-state">on</span>
        </label>
      </div>

      <p id="status-msg" class="df-status-msg" aria-live="polite"></p>
    </div>

    <footer class="df-footer">
      <div class="df-footer-row">
        <a href="#" id="manage-presets-link" class="df-link">
          <span class="df-accent-blue">$</span>manage presets <span class="df-link-arrow">↗</span>
        </a>
        <span class="df-shortcut-badge"><span class="df-accent">--</span>alt+shift+f</span>
      </div>
      <p id="last-fill-line" class="df-last-fill">
        <span class="df-accent">#</span>no fills yet this session
      </p>
    </footer>
  </div>

  <script src="lib/presetStore.js"></script>
  <script src="popup.js"></script>
</body>
</html>
